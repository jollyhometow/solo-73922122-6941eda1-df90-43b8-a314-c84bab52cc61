<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tas 距平处理服务 · 共享基准与交错取消演示</title>
<style>
  :root {
    --bg: #0f1720; --panel: #17222e; --line: #2a3a4a; --text: #dbe6f0;
    --muted: #8aa0b4; --accent: #4aa8ff; --ok: #3ecf8e; --warn: #ffb454;
    --err: #ff6b6b; --cancel: #c084fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
  }
  header { padding: 20px 28px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); }
  main { display: grid; gap: 18px; padding: 22px 28px 40px; max-width: 1180px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px;
  }
  .panel h2 { margin: 0 0 10px; font-size: 15px; color: var(--accent); }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: 4px 14px; }
  .kv .k { color: var(--muted); }
  code { background: #0c141d; padding: 1px 6px; border-radius: 4px; }
  form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=file] { color: var(--muted); }
  button {
    border: 1px solid var(--line); background: #20303f; color: var(--text);
    padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent);
    color: #07131f; font-weight: 600; }
  button.danger { color: var(--err); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
    vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap; }
  .b-queued { background: #28384a; color: var(--muted); }
  .b-starting { background: #28384a; color: var(--warn); }
  .b-running { background: #143b5c; color: var(--accent); }
  .b-draining { background: #3f2a55; color: var(--cancel); }
  .b-terminated { background: #332244; color: var(--cancel); }
  .b-cancelling { background: #3f2a55; color: var(--cancel); }
  .b-done { background: #11402e; color: var(--ok); }
  .b-error { background: #4a1d23; color: var(--err); }
  .b-cancelled { background: #332244; color: var(--cancel); }
  .msg { color: var(--muted); }
  .samples a { color: var(--accent); text-decoration: none; margin-right: 14px; }
  .samples a:hover { text-decoration: underline; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .flash { padding: 8px 12px; border-radius: 7px; margin-top: 10px;
    display: none; }
  .flash.err { background: #3a1d22; color: var(--err); display: block; }
  .flash.ok { background: #123528; color: var(--ok); display: block; }
  .pulse { animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
</style>
</head>
<body>
<header>
  <h1>月温度距平处理服务</h1>
  <p>固定历史基准 · 共享基准计算 · 最多 2 个未结束任务 · 独立进程计算 · 严格取消语义</p>
</header>
<main>
  <section class="panel">
    <h2>① 历史基准状态</h2>
    <div class="kv" id="baseline"><div class="k">加载中…</div><div></div></div>
  </section>

  <section class="panel">
    <h2>② 提交目标 NetCDF（仅 tas(time,lat,lon)，开尔文，网格须与基准一致）</h2>
    <form id="upload-form">
      <input type="file" id="file" name="file" accept=".nc,.nc4,.h5,.hdf" required />
      <button class="primary" type="submit">提交任务</button>
      <span class="hint">同时最多受理 <strong>2</strong> 份未结束任务，超出将返回 409。</span>
    </form>
    <div id="flash" class="flash"></div>
  </section>

  <section class="panel">
    <h2>③ 任务列表（每 1.2 秒自动刷新）</h2>
    <table>
      <thead>
        <tr><th>状态</th><th>阶段</th><th>任务 / 文件</th><th>消息</th><th>操作</th></tr>
      </thead>
      <tbody id="jobs"><tr><td colspan="5" class="msg">暂无任务</td></tr></tbody>
    </table>
    <p class="hint">演示：连续提交两份任务可在“消息”列看到它们挂接同一个共享基准运行；
      基准完成前取消其中一份不会影响另一份；取消最后一份等待者会终止并回收基准计算。</p>
  </section>

  <section class="panel samples">
    <h2>④ 虚构样例数据（可下载后上传演示）</h2>
    <div id="sample-list" class="msg">加载中…</div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const TERMINAL = new Set(["done", "error", "cancelled"]);

function flash(text, ok) {
  const el = $("#flash");
  el.textContent = text;
  el.className = "flash " + (ok ? "ok" : "err");
  setTimeout(() => { el.className = "flash"; }, 6000);
}

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
  return data;
}

async function refreshBaseline() {
  try {
    const b = await getJSON("/api/baseline");
    const grid = b.grid ? `lat=${b.grid.lat_size}, lon=${b.grid.lon_size}
      (${b.grid.lat_min}…${b.grid.lat_max}, ${b.grid.lon_min}…${b.grid.lon_max})` : "—";
    const busy = new Set(["starting", "running", "draining"]);
    const run = b.active_run
      ? `<span class="badge b-${b.active_run.status} ${busy.has(b.active_run.status) ? "pulse" : ""}">${b.active_run.status}</span>
         run=<code>${b.active_run.run_id.slice(0,8)}</code>
         等待者=[${b.active_run.waiters.map(w => w.slice(0,8)).join(", ") || "无"}]
         <div class="msg">${b.active_run.message}</div>`
      : (b.climatology_ready ? '<span class="badge b-done">ready</span> 基准均值已存在，新任务直接计算距平'
                             : '<span class="badge b-queued">idle</span> 尚无计算运行');
    $("#baseline").innerHTML = `
      <div class="k">固定基准文件</div><div><code>${b.configured_file}</code></div>
      <div class="k">网格</div><div>${grid}</div>
      <div class="k">月气候态文件</div><div>${b.climatology_ready ? "已生成" : "尚未生成（首个任务触发共享计算）"}</div>
      <div class="k">当前运行</div><div>${run}</div>`;
  } catch (e) { /* transient poll errors are ignored */ }
}

async function refreshJobs() {
  const data = await getJSON("/api/jobs");
  const body = $("#jobs");
  if (!data.jobs.length) {
    body.innerHTML = '<tr><td colspan="5" class="msg">暂无任务</td></tr>';
    return;
  }
  body.innerHTML = data.jobs.map(j => {
    const terminal = TERMINAL.has(j.state);
    const actions = terminal
      ? (j.state === "done"
          ? `<a href="${j.download}"><button class="primary">下载距平 NetCDF</button></a>`
          : '<span class="msg">—</span>')
      : `<button class="danger" onclick="cancelJob('${j.id}')">取消</button>`;
    return `<tr>
      <td><span class="badge b-${j.state} ${j.state === "running" || j.state === "cancelling" ? "pulse" : ""}">${j.state}</span></td>
      <td>${j.stage}${j.baseline_active ? ' <span class="msg">(挂接共享基准)</span>' : ""}</td>
      <td><code>${j.id.slice(0,8)}</code><div class="msg">${j.upload_name}</div></td>
      <td class="msg">${j.message}<div>${new Date(j.updated_at).toLocaleTimeString()}</div></td>
      <td>${actions}</td></tr>`;
  }).join("");
}

async function refreshSamples() {
  try {
    const data = await getJSON("/api/samples");
    $("#sample-list").innerHTML = data.samples.length
      ? data.samples.map(s =>
          `<a href="${s.href}" download>${s.name}</a>`).join("")
      : '<span class="msg">样例目录为空</span>';
  } catch (e) { /* ignore */ }
}

window.cancelJob = async function (id) {
  try {
    await getJSON(`/api/jobs/${id}/cancel`, { method: "POST" });
    flash("已请求取消：任务将在工作进程退出并清理后报告 cancelled", true);
  } catch (e) { flash(e.message, false); }
  refreshJobs();
};

$("#upload-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const file = $("#file").files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append("file", file);
  try {
    const job = await fetch("/api/jobs", { method: "POST", body: fd })
      .then(async r => {
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
        return d;
      });
    flash(`任务 ${job.id.slice(0,8)} 已受理`, true);
    $("#file").value = "";
  } catch (e) { flash(e.message, false); }
  refreshJobs();
});

async function poll() {
  await Promise.allSettled([refreshBaseline(), refreshJobs()]);
}
refreshSamples();
poll();
setInterval(poll, 1200);
</script>
</body>
</html>
