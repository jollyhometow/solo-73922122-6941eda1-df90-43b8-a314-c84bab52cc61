[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tas-anomaly-service"
version = "1.0.0"
description = "FastAPI service turning monthly tas NetCDF files into baseline-relative anomalies"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "xarray>=2024.2",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "cftime>=1.6",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
